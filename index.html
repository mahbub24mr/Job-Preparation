<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>MY MCQ</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#4338ca">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MY MCQ">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Hind Siliguri', 'Noto Sans Bengali', Arial, sans-serif;
    background: #f2f4f7;
    margin: 0;
    color: #1f2937;
  }
  #app { max-width: 820px; margin: 0 auto; padding: 12px; }

  #topbar {
    position: sticky; top: 0; z-index: 20;
    background: #fff;
    padding: 10px 14px;
    border-radius: 10px;
    box-shadow: 0 1px 6px rgba(0,0,0,.08);
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 12px;
  }
  #timer {
    font-weight: 700; font-size: 18px;
    background: #eef2ff; color: #4338ca;
    padding: 6px 14px; border-radius: 8px;
    min-width: 90px; text-align: center;
  }
  #timer.warn { background: #fee2e2; color: #b91c1c; }
  #progress-text { font-size: 14px; color: #555; }
  #submitBtn {
    background: #16a34a; color: #fff; border: none;
    padding: 8px 16px; border-radius: 8px; font-size: 14px;
    font-weight: 600; cursor: pointer;
  }
  #submitBtn:hover { background: #15803d; }

  #navGrid {
    display: none;
    grid-template-columns: repeat(10, 1fr);
    gap: 5px;
    background: #fff;
    padding: 10px;
    border-radius: 10px;
    margin-bottom: 12px;
    box-shadow: 0 1px 6px rgba(0,0,0,.06);
  }
  #navGrid.open { display: grid; }
  #navGridToggle {
    width: 100%; text-align: center; padding: 8px;
    background: #fff; border: 1px solid #e5e7eb; border-radius: 10px;
    font-size: 13px; color: #4338ca; font-weight: 600; cursor: pointer;
    margin-bottom: 10px;
  }
  .navBtn {
    aspect-ratio: 1;
    border-radius: 6px;
    border: 1px solid #d1d5db;
    background: #fff;
    font-size: 12px;
    cursor: pointer;
    color: #374151;
  }
  .navBtn.answered { background: #dbeafe; border-color: #93c5fd; color: #1d4ed8; }
  .navBtn.current { outline: 2px solid #4338ca; }

  #qcard {
    background: #fff;
    border-radius: 12px;
    padding: 18px;
    box-shadow: 0 1px 6px rgba(0,0,0,.08);
    margin-bottom: 14px;
  }
  #qMeta { font-size: 13px; color: #6b7280; margin-bottom: 6px; }
  #qText { font-size: 17px; font-weight: 600; margin-bottom: 14px; line-height: 1.5; }
  .option {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 12px; margin-bottom: 8px;
    border: 1px solid #e5e7eb; border-radius: 8px;
    cursor: pointer; font-size: 15px;
  }
  .option:hover { background: #f9fafb; }
  .option.selected { background: #eef2ff; border-color: #6366f1; }
  .option input { accent-color: #4338ca; }

  #navButtons { display: flex; justify-content: space-between; gap: 8px; }
  .navArrow {
    flex: 1; padding: 10px; border: none; border-radius: 8px;
    font-size: 15px; font-weight: 600; cursor: pointer;
    background: #e5e7eb; color: #374151;
  }
  .navArrow:hover { background: #d1d5db; }
  .navArrow:disabled { opacity: .4; cursor: not-allowed; }

  #results { display: none; }
  .scoreSummary {
    background: #fff; border-radius: 12px; padding: 20px;
    box-shadow: 0 1px 6px rgba(0,0,0,.08); margin-bottom: 14px;
    text-align: center;
  }
  .scoreSummary h2 { margin: 0 0 6px; font-size: 22px; }
  .scoreGrid {
    display: grid; grid-template-columns: repeat(4,1fr); gap: 8px;
    margin-top: 14px;
  }
  .scoreBox { background: #f9fafb; border-radius: 8px; padding: 10px 4px; }
  .scoreBox .num { font-size: 20px; font-weight: 700; }
  .scoreBox .label { font-size: 12px; color: #6b7280; }
  .reviewCard {
    background: #fff; border-radius: 10px; padding: 14px;
    margin-bottom: 10px; box-shadow: 0 1px 4px rgba(0,0,0,.06);
    border-left: 5px solid #d1d5db;
  }
  .reviewCard.correct { border-left-color: #16a34a; }
  .reviewCard.wrong { border-left-color: #dc2626; }
  .reviewCard.skipped { border-left-color: #9ca3af; }
  .reviewQ { font-weight: 600; margin-bottom: 8px; }
  .reviewOpt { padding: 4px 8px; font-size: 14px; border-radius: 6px; margin-bottom: 3px; }
  .reviewOpt.rightAns { background: #dcfce7; color: #166534; font-weight: 600; }
  .reviewOpt.userWrong { background: #fee2e2; color: #991b1b; font-weight: 600; }
  .explain { margin-top: 8px; font-size: 13.5px; background: #f9fafb; padding: 8px 10px; border-radius: 6px; color: #374151; }
  #restartBtn {
    display: block; width: 100%; margin-top: 10px; padding: 12px;
    background: #4338ca; color: #fff; border: none; border-radius: 8px;
    font-size: 15px; font-weight: 600; cursor: pointer;
  }
  .screenCard {
    background: #fff; border-radius: 12px; padding: 20px; text-align: center;
    box-shadow: 0 1px 6px rgba(0,0,0,.08);
  }
  .screenCard h1 { font-size: 20px; margin-bottom: 4px; }
  .screenCard > p.sub { color: #555; font-size: 13px; margin-bottom: 16px; }
  .folderCard {
    border: 1px solid #e5e7eb; border-radius: 10px; padding: 14px;
    margin-bottom: 10px; text-align: left; background: #fafafa; cursor: pointer;
  }
  .folderCard .wname { font-size: 16px; font-weight: 700; color: #1f2937; }
  .folderCard .wmeta { font-size: 12.5px; color: #6b7280; margin-top: 4px; }
  .backLink {
    display: inline-block; margin-bottom: 12px; font-size: 13px; color: #4338ca;
    cursor: pointer; font-weight: 600;
  }
  .subjectTag {
    display:inline-block; background:#eef2ff; color:#4338ca; font-size:12px;
    padding:2px 8px; border-radius: 20px; margin-bottom: 6px;
  }
  .bigActionBtn {
    background: #4338ca; color: #fff; border: none; padding: 14px;
    border-radius: 10px; font-size: 16px; font-weight: 700; cursor: pointer; width: 100%;
    margin-top: 12px;
  }
  .lastResultBox {
    background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 10px;
    padding: 14px; text-align: left; margin-top: 10px;
  }
  .lastResultBox .lrTitle { font-size: 13px; color: #6b7280; margin-bottom: 6px; }
  .lastResultBox .lrScore { font-size: 26px; font-weight: 800; color: #4338ca; }
  #fabHistory {
    position: fixed; bottom: 18px; right: 18px; z-index: 100;
    width: 52px; height: 52px; border-radius: 50%;
    background: #4338ca; color: #fff; border: none;
    font-size: 22px; cursor: pointer;
    box-shadow: 0 4px 12px rgba(67,56,202,.4);
    display: flex; align-items: center; justify-content: center;
  }
  #fabHistory:hover { background: #3730a3; }
  #historyOverlay {
    display: none; position: fixed; inset: 0; z-index: 200;
    background: rgba(17,24,39,.5);
    align-items: flex-end; justify-content: center;
  }
  #historyModal {
    background: #f2f4f7; width: 100%; max-width: 820px;
    max-height: 85vh; overflow-y: auto;
    border-radius: 16px 16px 0 0; padding: 16px;
  }
  #historyModalHeader {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 10px; position: sticky; top: 0; background: #f2f4f7; padding-bottom: 6px;
  }
  #historyModalHeader h2 { margin: 0; font-size: 18px; }
  #closeHistoryBtn {
    background: #e5e7eb; border: none; width: 32px; height: 32px; border-radius: 50%;
    font-size: 16px; cursor: pointer;
  }
  .tabBtn {
    flex: 1; padding: 8px; border: 1px solid #d1d5db; background: #fff;
    border-radius: 8px; font-size: 13px; font-weight: 600; color: #374151; cursor: pointer;
  }
  .tabBtn.activeTab { background: #4338ca; color: #fff; border-color: #4338ca; }
  .qStatCard {
    border: 1px solid #e5e7eb; border-radius: 8px; padding: 8px 10px;
    margin-bottom: 6px; background: #fff;
  }
  .qStatCard .subj { font-size: 11px; color: #6b7280; }
  .qStatCard .qtext { font-size: 13.5px; font-weight: 600; margin: 2px 0; }
  .qStatCard .stats { font-size: 12px; color: #374151; }
  .qStatCard .none { font-size: 12px; color: #9ca3af; }
  #selectRow { margin-bottom: 8px; display: flex; gap: 6px; }
  #selectRow select {
    flex: 1; padding: 8px; border-radius: 8px; border: 1px solid #d1d5db;
    font-size: 13px; background: #fff;
  }
  @media (max-width: 480px) {
    #navGrid { grid-template-columns: repeat(6, 1fr); }
    .scoreGrid { grid-template-columns: repeat(2,1fr); }
  }
</style>
</head>
<body>
<div id="app">

  <div id="subjectListScreen" class="screenCard">
    <h1>📝 MY MCQ</h1>
    <p class="sub">বিষয় বেছে নিন</p>
    <div id="subjectList"></div>
  </div>

  <div id="testListScreen" class="screenCard" style="display:none; text-align:left;">
    <span class="backLink" id="backToSubjectsBtn">← সব বিষয়</span>
    <h1 id="testListTitle" style="font-size:18px;margin:6px 0 12px;"></h1>
    <div id="testList"></div>
  </div>

  <div id="questionListScreen" class="screenCard" style="display:none; text-align:left;">
    <span class="backLink" id="backToTestListBtn">← টেস্ট তালিকা</span>
    <h1 id="questionListTitle" style="font-size:18px;margin:6px 0 12px;"></h1>
    <div id="questionList"></div>
  </div>

  <div id="testDetailScreen" class="screenCard" style="display:none; text-align:left;">
    <span class="backLink" id="backToTestsBtn">← প্রশ্ন তালিকা</span>
    <h1 id="testDetailTitle" style="font-size:18px;margin:6px 0 4px;"></h1>
    <p class="sub" id="testDetailMeta"></p>
    <div id="lastResultArea"></div>
    <button class="bigActionBtn" id="startOrAgainBtn">টেস্ট শুরু করুন</button>
  </div>

  <div id="testScreen" style="display:none;">
    <div id="topbar">
      <div id="progress-text">প্রশ্ন <span id="curNum">1</span>/<span id="totalQ">0</span></div>
      <div id="timer">০০:০০</div>
      <button id="submitBtn">সাবমিট</button>
    </div>
    <div id="navGrid"></div>
    <button id="navGridToggle">🔢 সব প্রশ্নের তালিকা দেখুন</button>
    <div id="qcard">
      <div id="qMeta"></div>
      <div id="qText"></div>
      <div id="options"></div>
      <div id="navButtons">
        <button class="navArrow" id="prevBtn">← আগের প্রশ্ন</button>
        <button class="navArrow" id="nextBtn">পরের প্রশ্ন →</button>
      </div>
    </div>
  </div>

  <div id="results"></div>

  <button id="fabHistory" title="ইতিহাস দেখুন">📊</button>
  <div id="historyOverlay">
    <div id="historyModal">
      <div id="historyModalHeader">
        <h2>📊 আমার পারফরম্যান্স</h2>
        <button id="closeHistoryBtn">✕</button>
      </div>
      <div id="historyTabs" style="display:flex;gap:6px;margin-bottom:10px;">
        <button class="tabBtn" data-tab="attempts">টেস্ট ইতিহাস</button>
        <button class="tabBtn" data-tab="questions">প্রশ্নভিত্তিক ফলাফল</button>
      </div>
      <div id="historyContent"></div>
    </div>
  </div>

</div>

<script>
const SUBJECT_FILES = [
  {
    "name": "সাধারণ জ্ঞান",
    "file": "shadharon-gyan.json"
  },
  {
    "name": "English",
    "file": "english.json"
  },
  {
    "name": "গণিত",
    "file": "gonit.json"
  },
  {
    "name": "বাংলা",
    "file": "bangla.json"
  },
  {
    "name": "Job",
    "file": "job.json"
  }
];
let SUBJECTS = [];
let QUESTIONS = [];
let currentSubjectIndex = 0;
let currentTestIndex = 0;
let currentSetIndex = 0;
let current = 0;
let answers = [];
let TOTAL_TIME = 0;
let timeLeft = 0;
let timerInterval = null;
let submitted = false;

const subjectListScreen = document.getElementById('subjectListScreen');
const testListScreen = document.getElementById('testListScreen');
const questionListScreen = document.getElementById('questionListScreen');
const testDetailScreen = document.getElementById('testDetailScreen');
const testScreen = document.getElementById('testScreen');
const resultsDiv = document.getElementById('results');
const navGrid = document.getElementById('navGrid');
const timerEl = document.getElementById('timer');
const curNumEl = document.getElementById('curNum');
const totalQEl = document.getElementById('totalQ');
const qMetaEl = document.getElementById('qMeta');
const qTextEl = document.getElementById('qText');
const optionsEl = document.getElementById('options');

function toBn(str) {
  const map = {'0':'০','1':'১','2':'২','3':'৩','4':'৪','5':'৫','6':'৬','7':'৭','8':'৮','9':'৯'};
  return String(str).split('').map(c => map[c] !== undefined ? map[c] : c).join('');
}

function hideAllScreens() {
  subjectListScreen.style.display = 'none';
  testListScreen.style.display = 'none';
  questionListScreen.style.display = 'none';
  testDetailScreen.style.display = 'none';
  testScreen.style.display = 'none';
  resultsDiv.style.display = 'none';
}

function totalTestsInSubject(s) { return s.tests.length; }
function totalQuestionsInSubject(s) { return s.tests.reduce((sum, t) => sum + t.sets.reduce((s2, st) => s2 + st.questions.length, 0), 0); }

function renderSubjectList() {
  const container = document.getElementById('subjectList');
  container.innerHTML = '';
  SUBJECTS.forEach((s, idx) => {
    const div = document.createElement('div');
    div.className = 'folderCard';
    div.innerHTML = '<div class="wname">📁 ' + s.name + '</div>' +
      '<div class="wmeta">' + toBn(totalTestsInSubject(s)) + 'টি টেস্ট • মোট ' + toBn(totalQuestionsInSubject(s)) + 'টি প্রশ্ন</div>';
    div.addEventListener('click', () => openSubject(idx));
    container.appendChild(div);
  });
}

function openSubject(subjectIdx) {
  currentSubjectIndex = subjectIdx;
  const s = SUBJECTS[subjectIdx];
  document.getElementById('testListTitle').textContent = '📁 ' + s.name;
  const hist = loadHistory();
  const container = document.getElementById('testList');
  container.innerHTML = '';
  s.tests.forEach((t, tIdx) => {
    const totalQ = t.sets.reduce((sum, st) => sum + st.questions.length, 0);
    const attemptsForTest = hist.filter(r => r.subjectName === s.name && r.testName === t.name).length;
    const div = document.createElement('div');
    div.className = 'folderCard';
    div.innerHTML = '<div class="wname">📄 ' + t.name + '</div>' +
      '<div class="wmeta">মোট প্রশ্ন সংখ্যা: ' + toBn(totalQ) + ' • এটেম্পট: ' + toBn(attemptsForTest) + ' বার</div>';
    div.addEventListener('click', () => openQuestionList(subjectIdx, tIdx));
    container.appendChild(div);
  });
  hideAllScreens();
  testListScreen.style.display = 'block';
}

document.getElementById('backToSubjectsBtn').addEventListener('click', () => {
  hideAllScreens();
  subjectListScreen.style.display = 'block';
});

function openQuestionList(subjectIdx, testIdx) {
  currentSubjectIndex = subjectIdx;
  currentTestIndex = testIdx;
  const s = SUBJECTS[subjectIdx];
  const t = s.tests[testIdx];
  document.getElementById('questionListTitle').textContent = '📄 ' + s.name + ' — ' + t.name;
  const hist = loadHistory();
  const container = document.getElementById('questionList');
  container.innerHTML = '';
  t.sets.forEach((st, setIdx) => {
    const attemptsForSet = hist.filter(r => r.subjectName === s.name && r.testName === t.name && r.setName === st.name).length;
    const div = document.createElement('div');
    div.className = 'folderCard';
    div.innerHTML = '<div class="wname">📝 ' + st.name + '</div>' +
      '<div class="wmeta">প্রশ্ন সংখ্যা: ' + toBn(st.questions.length) + ' • এটেম্পট: ' + toBn(attemptsForSet) + ' বার</div>';
    div.addEventListener('click', () => openTestDetail(subjectIdx, testIdx, setIdx));
    container.appendChild(div);
  });
  hideAllScreens();
  questionListScreen.style.display = 'block';
}

document.getElementById('backToTestListBtn').addEventListener('click', () => {
  openSubject(currentSubjectIndex);
});

function openTestDetail(subjectIdx, testIdx, setIdx) {
  currentSubjectIndex = subjectIdx;
  currentTestIndex = testIdx;
  currentSetIndex = setIdx;
  const s = SUBJECTS[subjectIdx];
  const t = s.tests[testIdx];
  const st = t.sets[setIdx];
  document.getElementById('testDetailTitle').textContent = '📄 ' + s.name + ' — ' + t.name + ' — ' + st.name;
  document.getElementById('testDetailMeta').textContent = 'মোট প্রশ্ন: ' + toBn(st.questions.length);

  const hist = loadHistory();
  const attemptsForTest = hist.filter(r => r.subjectName === s.name && r.testName === t.name && r.setName === st.name);
  const lastArea = document.getElementById('lastResultArea');
  const startBtn = document.getElementById('startOrAgainBtn');

  if (attemptsForTest.length === 0) {
    lastArea.innerHTML = '<div class="lastResultBox"><div class="lrTitle">এখনো এই টেস্ট দেননি</div></div>';
    startBtn.textContent = 'টেস্ট শুরু করুন';
  } else {
    const last = attemptsForTest[0]; // newest first
    const mins = Math.floor((last.timeTakenSeconds||0)/60);
    const secs = (last.timeTakenSeconds||0)%60;
    lastArea.innerHTML = '<div class="lastResultBox">' +
      '<div class="lrTitle">সর্বশেষ ফলাফল (' + last.date + ')</div>' +
      '<div class="lrScore">' + last.score.toFixed(2) + ' / ' + last.maxScore + '</div>' +
      '<div style="font-size:13px;color:#374151;margin-top:6px;">সঠিক: ' + last.correct + ' • ভুল: ' + last.wrong + ' • বাদ: ' + last.skipped + '</div>' +
      '<div style="font-size:13px;color:#374151;margin-top:2px;">সময় লেগেছে: ' + toBn(mins) + ' মিনিট ' + toBn(secs) + ' সেকেন্ড</div>' +
      '</div>';
    startBtn.textContent = 'Test Again';
  }

  startBtn.onclick = () => startTest(subjectIdx, testIdx, setIdx);

  hideAllScreens();
  testDetailScreen.style.display = 'block';
}

document.getElementById('backToTestsBtn').addEventListener('click', () => {
  openQuestionList(currentSubjectIndex, currentTestIndex);
});

function startTest(subjectIdx, testIdx, setIdx) {
  currentSubjectIndex = subjectIdx;
  currentTestIndex = testIdx;
  currentSetIndex = setIdx;
  QUESTIONS = SUBJECTS[subjectIdx].tests[testIdx].sets[setIdx].questions;
  answers = new Array(QUESTIONS.length).fill(null);
  current = 0;
  submitted = false;
  TOTAL_TIME = Math.max(300, Math.round(QUESTIONS.length * 36)); // ~36s/question, same ratio as 100Q/60min
  timeLeft = TOTAL_TIME;

  hideAllScreens();
  testScreen.style.display = 'block';
  totalQEl.textContent = toBn(QUESTIONS.length);
  navGrid.classList.remove('open');
  document.getElementById('navGridToggle').textContent = '🔢 সব প্রশ্নের তালিকা দেখুন';
  buildNavGrid();
  render();
  updateTimerDisplay();
  if (timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(tick, 1000);
}

function tick() {
  timeLeft--;
  updateTimerDisplay();
  if (timeLeft <= 0) {
    clearInterval(timerInterval);
    finishTest(true);
  }
}

function updateTimerDisplay() {
  const m = Math.floor(timeLeft/60);
  const s = timeLeft%60;
  const mm = String(m).padStart(2,'0');
  const ss = String(s).padStart(2,'0');
  timerEl.textContent = toBn(mm) + ':' + toBn(ss);
  timerEl.classList.toggle('warn', timeLeft <= 300);
}

function buildNavGrid() {
  navGrid.innerHTML = '';
  QUESTIONS.forEach((q, i) => {
    const b = document.createElement('button');
    b.className = 'navBtn';
    b.textContent = toBn(i+1);
    b.addEventListener('click', () => { current = i; render(); });
    navGrid.appendChild(b);
  });
}

function render() {
  const q = QUESTIONS[current];
  curNumEl.textContent = toBn(current+1);
  qMetaEl.innerHTML = '<span class="subjectTag">' + SUBJECTS[currentSubjectIndex].name + '</span>';
  qTextEl.textContent = q.q;
  optionsEl.innerHTML = '';
  q.o.forEach((optText, idx) => {
    const div = document.createElement('div');
    div.className = 'option' + (answers[current]===idx ? ' selected' : '');
    div.innerHTML = '<input type="radio" name="opt" ' + (answers[current]===idx?'checked':'') + '> <span>' + optText + '</span>';
    div.addEventListener('click', () => { answers[current] = idx; render(); });
    optionsEl.appendChild(div);
  });
  document.getElementById('prevBtn').disabled = current === 0;
  document.getElementById('nextBtn').disabled = current === QUESTIONS.length-1;

  Array.from(navGrid.children).forEach((btn, i) => {
    btn.classList.toggle('answered', answers[i] !== null);
    btn.classList.toggle('current', i === current);
  });
}

document.getElementById('submitBtn').addEventListener('click', () => {
  finishTest(false);
});
document.getElementById('prevBtn').addEventListener('click', () => { if(current>0){current--; render();} });
document.getElementById('nextBtn').addEventListener('click', () => { if(current<QUESTIONS.length-1){current++; render();} });
document.getElementById('navGridToggle').addEventListener('click', () => {
  const isOpen = navGrid.classList.toggle('open');
  document.getElementById('navGridToggle').textContent = isOpen ? '🔼 তালিকা বন্ধ করুন' : '🔢 সব প্রশ্নের তালিকা দেখুন';
});

const HISTORY_KEY = 'mymcq_test_history_v4';
const STATS_KEY = 'mymcq_question_stats_v4';
let activeTab = 'attempts';

function loadHistory() {
  try { return JSON.parse(localStorage.getItem(HISTORY_KEY)) || []; } catch(e) { return []; }
}

function saveAttemptToHistory(record) {
  try {
    const hist = loadHistory();
    hist.unshift(record);
    localStorage.setItem(HISTORY_KEY, JSON.stringify(hist));
  } catch(e) { console.error('history save failed', e); }
}

function getQuestionStats() {
  try { return JSON.parse(localStorage.getItem(STATS_KEY)) || {}; } catch(e) { return {}; }
}

function statKey(subjectIdx, testIdx, setIdx, qIdx) { return subjectIdx + '-' + testIdx + '-' + setIdx + '-' + qIdx; }

function updateQuestionStats() {
  const stats = getQuestionStats();
  const now = new Date().toLocaleDateString('bn-BD');
  QUESTIONS.forEach((q, i) => {
    const key = statKey(currentSubjectIndex, currentTestIndex, currentSetIndex, i);
    if (!stats[key]) stats[key] = { attempts: 0, correct: 0, wrong: 0, skipped: 0, lastDate: '' };
    const s = stats[key];
    const ans = answers[i];
    s.attempts++;
    if (ans === null) s.skipped++;
    else if (ans === q.a) s.correct++;
    else s.wrong++;
    s.lastDate = now;
  });
  localStorage.setItem(STATS_KEY, JSON.stringify(stats));
}

function finishTest(byTimeout) {
  if (submitted) return;
  submitted = true;
  clearInterval(timerInterval);
  testScreen.style.display = 'none';

  let correct = 0, wrong = 0, skipped = 0;
  QUESTIONS.forEach((q, i) => {
    if (answers[i] === null) skipped++;
    else if (answers[i] === q.a) correct++;
    else wrong++;
  });
  const score = (correct * 1) - (wrong * 0.25);
  const maxScore = QUESTIONS.length;
  const subjectName = SUBJECTS[currentSubjectIndex].name;
  const testName = SUBJECTS[currentSubjectIndex].tests[currentTestIndex].name;
  const setName = SUBJECTS[currentSubjectIndex].tests[currentTestIndex].sets[currentSetIndex].name;
  const timeTakenSeconds = TOTAL_TIME - Math.max(0, timeLeft);

  const now = new Date();
  saveAttemptToHistory({
    date: now.toLocaleString('bn-BD', { dateStyle: 'medium', timeStyle: 'short' }),
    subjectName: subjectName,
    testName: testName,
    setName: setName,
    score: score,
    maxScore: maxScore,
    correct: correct,
    wrong: wrong,
    skipped: skipped,
    timeTakenSeconds: timeTakenSeconds,
    finishedByTimeout: !!byTimeout
  });
  updateQuestionStats();

  let html = '';
  html += '<div class="scoreSummary">';
  html += '<h2>🎉 ' + subjectName + ' — ' + testName + '</h2>';
  html += '<div style="font-size:32px;font-weight:800;color:#4338ca;">' + score.toFixed(2) + ' / ' + maxScore + '</div>';
  html += '<div class="scoreGrid">';
  html += '<div class="scoreBox"><div class="num" style="color:#16a34a;">' + correct + '</div><div class="label">সঠিক</div></div>';
  html += '<div class="scoreBox"><div class="num" style="color:#dc2626;">' + wrong + '</div><div class="label">ভুল</div></div>';
  html += '<div class="scoreBox"><div class="num" style="color:#6b7280;">' + skipped + '</div><div class="label">বাদ দেওয়া</div></div>';
  html += '<div class="scoreBox"><div class="num" style="color:#b91c1c;">-' + (wrong*0.25).toFixed(2) + '</div><div class="label">নেগেটিভ মার্ক</div></div>';
  html += '</div></div>';

  QUESTIONS.forEach((q, i) => {
    const userAns = answers[i];
    const status = userAns === null ? 'skipped' : (userAns === q.a ? 'correct' : 'wrong');
    const statusLabel = status === 'correct' ? '✅ সঠিক' : status === 'wrong' ? '❌ ভুল' : '➖ বাদ দেওয়া হয়েছে';
    html += '<div class="reviewCard ' + status + '">';
    html += '<div class="reviewQ">' + toBn(i+1) + '. ' + q.q + ' <span style="font-size:12px;color:#6b7280;">(' + statusLabel + ')</span></div>';
    q.o.forEach((optText, idx) => {
      let cls = 'reviewOpt';
      if (idx === q.a) cls += ' rightAns';
      else if (idx === userAns) cls += ' userWrong';
      html += '<div class="' + cls + '">' + optText + '</div>';
    });
    html += '<div class="explain"><strong>ব্যাখ্যা:</strong> ' + q.e + '</div>';
    html += '</div>';
  });

  html += '<button id="restartBtn">টেস্ট বিস্তারিত পাতায় ফিরে যান</button>';
  resultsDiv.innerHTML = html;
  resultsDiv.style.display = 'block';
  document.getElementById('restartBtn').addEventListener('click', () => {
    openTestDetail(currentSubjectIndex, currentTestIndex, currentSetIndex);
    window.scrollTo(0,0);
  });
  window.scrollTo(0,0);
}

document.getElementById('fabHistory').addEventListener('click', () => showHistory('attempts'));
document.getElementById('closeHistoryBtn').addEventListener('click', hideHistory);
document.getElementById('historyOverlay').addEventListener('click', (e) => { if(e.target.id==='historyOverlay') hideHistory(); });
document.querySelectorAll('.tabBtn').forEach(btn => {
  btn.addEventListener('click', () => showHistory(btn.dataset.tab));
});

function hideHistory() {
  document.getElementById('historyOverlay').style.display = 'none';
}

function showHistory(tab) {
  activeTab = tab || activeTab;
  document.querySelectorAll('.tabBtn').forEach(b => b.classList.toggle('activeTab', b.dataset.tab === activeTab));
  const contentEl = document.getElementById('historyContent');
  if (activeTab === 'attempts') renderAttemptsTab(contentEl);
  else renderQuestionStatsTab(contentEl);
  document.getElementById('historyOverlay').style.display = 'flex';
}

function renderAttemptsTab(contentEl) {
  const hist = loadHistory();
  if (hist.length === 0) {
    contentEl.innerHTML = '<p style="color:#6b7280;">এখনো কোনো টেস্টের রেকর্ড নেই।</p>';
    return;
  }
  let html = '<div style="max-height:55vh;overflow-y:auto;">';
  hist.forEach((r) => {
    const mins = Math.floor((r.timeTakenSeconds||0)/60);
    const secs = (r.timeTakenSeconds||0)%60;
    html += '<div class="qStatCard">';
    html += '<div style="display:flex;justify-content:space-between;font-size:12px;color:#6b7280;"><span>' + r.date + '</span><span>' + (r.finishedByTimeout ? '⏱️ সময় শেষ' : '✅ সাবমিট') + '</span></div>';
    html += '<div style="font-size:13px;font-weight:700;color:#374151;margin-top:2px;">📁 ' + (r.subjectName || '') + ' &nbsp;›&nbsp; 📄 ' + (r.testName || '') + ' &nbsp;›&nbsp; 📝 ' + (r.setName || '') + '</div>';
    html += '<div style="font-size:19px;font-weight:700;color:#4338ca;margin:4px 0;">স্কোর: ' + r.score.toFixed(2) + ' / ' + (r.maxScore || 100) + '</div>';
    html += '<div class="stats">সঠিক: ' + r.correct + ' • ভুল: ' + r.wrong + ' • বাদ: ' + r.skipped + ' • সময়: ' + toBn(mins) + ' মিনিট ' + toBn(secs) + ' সে.</div>';
    html += '</div>';
  });
  html += '</div>';
  html += '<button id="clearHistBtn" style="margin-top:6px;background:#fee2e2;color:#b91c1c;border:none;padding:10px;border-radius:8px;font-size:13px;cursor:pointer;width:100%;">🗑️ টেস্ট ইতিহাস মুছুন</button>';
  contentEl.innerHTML = html;
  document.getElementById('clearHistBtn').addEventListener('click', () => {
    localStorage.removeItem(HISTORY_KEY); renderAttemptsTab(contentEl);
  });
}

function renderQuestionStatsTab(contentEl) {
  let html = '<div id="selectRow">';
  html += '<select id="subjSelect">';
  SUBJECTS.forEach((s, idx) => { html += '<option value="' + idx + '">📁 ' + s.name + '</option>'; });
  html += '</select>';
  html += '<select id="testSelect"></select>';
  html += '<select id="setSelect"></select>';
  html += '</div><div id="statsBody"></div>';
  contentEl.innerHTML = html;

  const subjSelect = document.getElementById('subjSelect');
  const testSelect = document.getElementById('testSelect');
  const setSelect = document.getElementById('setSelect');

  function populateTests(subjectIdx) {
    testSelect.innerHTML = '';
    SUBJECTS[subjectIdx].tests.forEach((t, tIdx) => {
      const opt = document.createElement('option');
      opt.value = tIdx;
      opt.textContent = '📄 ' + t.name;
      testSelect.appendChild(opt);
    });
  }

  function populateSets(subjectIdx, testIdx) {
    setSelect.innerHTML = '';
    SUBJECTS[subjectIdx].tests[testIdx].sets.forEach((st, stIdx) => {
      const opt = document.createElement('option');
      opt.value = stIdx;
      opt.textContent = '📝 ' + st.name;
      setSelect.appendChild(opt);
    });
  }

  subjSelect.value = String(currentSubjectIndex);
  populateTests(currentSubjectIndex);
  testSelect.value = String(currentTestIndex);
  populateSets(currentSubjectIndex, currentTestIndex);
  setSelect.value = String(currentSetIndex);

  subjSelect.addEventListener('change', () => {
    const sIdx = parseInt(subjSelect.value, 10);
    populateTests(sIdx);
    populateSets(sIdx, 0);
    renderStatsForTest(sIdx, 0, 0);
  });
  testSelect.addEventListener('change', () => {
    const sIdx = parseInt(subjSelect.value, 10);
    const tIdx = parseInt(testSelect.value, 10);
    populateSets(sIdx, tIdx);
    renderStatsForTest(sIdx, tIdx, 0);
  });
  setSelect.addEventListener('change', () => {
    renderStatsForTest(parseInt(subjSelect.value, 10), parseInt(testSelect.value, 10), parseInt(setSelect.value, 10));
  });

  renderStatsForTest(parseInt(subjSelect.value, 10), parseInt(testSelect.value, 10), parseInt(setSelect.value, 10));
}

function renderStatsForTest(subjectIdx, testIdx, setIdx) {
  const stats = getQuestionStats();
  const testQuestions = SUBJECTS[subjectIdx].tests[testIdx].sets[setIdx].questions;
  const body = document.getElementById('statsBody');
  const totalAttempted = testQuestions.filter((q, i) => stats[statKey(subjectIdx, testIdx, setIdx, i)] && stats[statKey(subjectIdx, testIdx, setIdx, i)].attempts > 0).length;

  let rows = testQuestions.map((q, i) => ({ q, i, s: stats[statKey(subjectIdx, testIdx, setIdx, i)] || { attempts: 0, correct: 0, wrong: 0, skipped: 0 } }));
  rows.sort((a, b) => {
    if (a.s.attempts === 0 && b.s.attempts === 0) return a.i - b.i;
    if (a.s.attempts === 0) return 1;
    if (b.s.attempts === 0) return -1;
    if (b.s.wrong !== a.s.wrong) return b.s.wrong - a.s.wrong;
    return b.s.attempts - a.s.attempts;
  });

  let html = '<div style="font-size:12px;color:#6b7280;margin-bottom:8px;">মোট ' + toBn(testQuestions.length) + 'টি প্রশ্নের মধ্যে ' + toBn(totalAttempted) + 'টিতে অন্তত একবার চেষ্টা করেছেন। ভুল বেশি হওয়া প্রশ্ন উপরে দেখানো হচ্ছে।</div>';
  html += '<div style="max-height:46vh;overflow-y:auto;">';
  rows.forEach(({ q, i, s }) => {
    html += '<div class="qStatCard">';
    html += '<div class="subj">প্রশ্ন ' + toBn(i+1) + '</div>';
    html += '<div class="qtext">' + q.q + '</div>';
    if (s.attempts === 0) {
      html += '<div class="none">এখনো চেষ্টা করা হয়নি</div>';
    } else {
      const acc = Math.round((s.correct / s.attempts) * 100);
      html += '<div class="stats">চেষ্টা: ' + s.attempts + ' • সঠিক: ' + s.correct + ' • ভুল: ' + s.wrong + ' • বাদ: ' + s.skipped + ' • নির্ভুলতা: ' + acc + '%</div>';
    }
    html += '</div>';
  });
  html += '</div>';
  html += '<button id="clearStatsBtn" style="margin-top:6px;background:#fee2e2;color:#b91c1c;border:none;padding:10px;border-radius:8px;font-size:13px;cursor:pointer;width:100%;">🗑️ এই সেটের পরিসংখ্যান মুছুন</button>';
  body.innerHTML = html;
  document.getElementById('clearStatsBtn').addEventListener('click', () => {
    const stats = getQuestionStats();
    testQuestions.forEach((q, i) => { delete stats[statKey(subjectIdx, testIdx, setIdx, i)]; });
    localStorage.setItem(STATS_KEY, JSON.stringify(stats));
    renderStatsForTest(subjectIdx, testIdx, setIdx);
  });
}

async function loadAllSubjects() {
  const container = document.getElementById('subjectList');
  container.innerHTML = '<p style="color:#6b7280;">⏳ প্রশ্ন লোড হচ্ছে...</p>';
  try {
    const results = await Promise.all(SUBJECT_FILES.map(async (sf) => {
      const res = await fetch(sf.file);
      if (!res.ok) throw new Error('লোড ব্যর্থ: ' + sf.file);
      const data = await res.json();
      return { name: sf.name, tests: data.tests };
    }));
    SUBJECTS = results;
    renderSubjectList();
  } catch (err) {
    container.innerHTML = '<p style="color:#dc2626;">⚠️ প্রশ্ন লোড করতে সমস্যা হয়েছে। ইন্টারনেট বা ফাইল পাথ চেক করুন।<br><small>' + (err.message||'') + '</small></p>';
    console.error(err);
  }
}

loadAllSubjects();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').catch(() => {});
  });
}
</script>
